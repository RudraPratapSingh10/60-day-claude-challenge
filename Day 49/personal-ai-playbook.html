<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal AI Playbook — Testing, QA &amp; Code Review with Claude</title>
<style>
/* =========================================================
   TOKENS
   ========================================================= */
:root{
  --bg:#0B1420;
  --bg-soft:#0E1826;
  --surface:#121E2E;
  --surface-2:#182740;
  --surface-3:#1E3050;
  --border:#24374F;
  --border-soft:#1A2A3E;
  --text:#E7EEF5;
  --text-dim:#93A7BB;
  --text-mute:#5E7690;
  --teal:#2DD4BF;
  --teal-dim:#1B9E8F;
  --teal-bg:rgba(45,212,191,0.12);
  --amber:#F5A623;
  --amber-bg:rgba(245,166,35,0.12);
  --violet:#8B7CF6;
  --violet-bg:rgba(139,124,246,0.14);
  --red:#F1667A;
  --red-bg:rgba(241,102,122,0.12);
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  --shadow-1:0 1px 2px rgba(0,0,0,0.4);
  --shadow-2:0 8px 24px rgba(0,0,0,0.45);
  --shadow-3:0 20px 60px rgba(0,0,0,0.55);
  --font-display: -apple-system, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-body: -apple-system, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  --nav-w: 232px;
  --transition: 180ms cubic-bezier(.4,0,.2,1);
}
html.light{
  --bg:#F3F5F8;
  --bg-soft:#EAEEF3;
  --surface:#FFFFFF;
  --surface-2:#F5F7FA;
  --surface-3:#EBEFF4;
  --border:#DCE3EB;
  --border-soft:#E7ECF1;
  --text:#101A26;
  --text-dim:#4B5D71;
  --text-mute:#8496A8;
  --teal-bg:rgba(20,166,148,0.10);
  --teal:#118A7B;
  --amber-bg:rgba(217,145,20,0.12);
  --amber:#B9740F;
  --violet-bg:rgba(124,105,235,0.12);
  --violet:#6C5CE0;
  --red-bg:rgba(213,60,80,0.10);
  --red:#D53C50;
  --shadow-1:0 1px 2px rgba(20,30,45,0.06);
  --shadow-2:0 8px 24px rgba(20,30,45,0.10);
  --shadow-3:0 20px 50px rgba(20,30,45,0.16);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
::selection{ background:var(--teal); color:#04211D; }
a{color:inherit;}
button{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-mute);}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* =========================================================
   LAYOUT
   ========================================================= */
.app{ display:flex; min-height:100vh; }

.sidebar{
  width:var(--nav-w);
  flex-shrink:0;
  background:var(--bg-soft);
  border-right:1px solid var(--border-soft);
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  z-index:40;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:20px 18px 16px 18px;
}
.brand-mark{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,var(--teal),var(--violet));
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset;
}
.brand-mark svg{width:16px;height:16px;}
.brand-text{ line-height:1.15; }
.brand-text strong{ display:block; font-family:var(--font-display); font-size:14.5px; font-weight:700; letter-spacing:-0.01em; }
.brand-text span{ display:block; font-size:10.5px; color:var(--text-mute); letter-spacing:0.04em; text-transform:uppercase; margin-top:2px;}

.nav{ padding:6px 12px; display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto;}
.nav-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-mute); padding:14px 10px 6px; font-weight:600;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:var(--radius-sm);
  color:var(--text-dim); font-size:13.5px; font-weight:500;
  cursor:pointer; border:1px solid transparent; text-align:left; background:none; width:100%;
  transition:background var(--transition), color var(--transition);
}
.nav-item svg{ width:16px;height:16px; flex-shrink:0; opacity:0.85;}
.nav-item:hover{ background:var(--surface-2); color:var(--text); }
.nav-item.active{ background:var(--teal-bg); color:var(--teal); }
.nav-item.active svg{ opacity:1; }
.nav-count{ margin-left:auto; font-size:10.5px; color:var(--text-mute); background:var(--surface-2); padding:1px 6px; border-radius:20px; }
.nav-item.active .nav-count{ color:var(--teal); background:rgba(45,212,191,0.16); }

.sidebar-foot{ padding:12px; border-top:1px solid var(--border-soft); display:flex; flex-direction:column; gap:6px;}
.foot-row{ display:flex; gap:6px; }
.icon-btn{
  display:flex; align-items:center; justify-content:center; gap:6px;
  background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text-dim);
  border-radius:var(--radius-sm); padding:8px; cursor:pointer; font-size:12px; flex:1;
  transition:all var(--transition);
}
.icon-btn:hover{ background:var(--surface-3); color:var(--text); }
.icon-btn svg{width:14px;height:14px;}

.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:12px;
  padding:14px 28px; background:rgba(11,20,32,0.82); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
}
html.light .topbar{ background:rgba(243,245,248,0.85); }
.menu-toggle{ display:none; }
.topbar h1{ font-family:var(--font-display); font-size:16.5px; font-weight:700; letter-spacing:-0.01em; margin:0; }
.topbar-sub{ font-size:12px; color:var(--text-mute); margin-top:1px; }
.topbar-spacer{ flex:1; }
.search-wrap{ position:relative; width:260px; }
.search-wrap input{
  width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
  border-radius:var(--radius-sm); padding:8px 10px 8px 32px; font-size:13px; outline:none;
  transition:border-color var(--transition);
}
.search-wrap input:focus{ border-color:var(--teal); }
.search-wrap svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--text-mute); }
.kbd{ font-family:var(--font-mono); font-size:10px; border:1px solid var(--border); border-radius:4px; padding:1px 5px; color:var(--text-mute); position:absolute; right:8px; top:50%; transform:translateY(-50%); }

.content{ padding:24px 28px 64px; max-width:1180px; width:100%; margin:0 auto; }

/* =========================================================
   EXPLAINER BANNER
   ========================================================= */
.explainer{
  background:linear-gradient(135deg, var(--surface-2), var(--surface));
  border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:20px 22px; margin-bottom:22px; position:relative;
  display:flex; gap:16px; align-items:flex-start;
}
.explainer-icon{
  width:34px;height:34px;border-radius:9px;background:var(--teal-bg);color:var(--teal);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.explainer-icon svg{width:18px;height:18px;}
.explainer h3{ margin:0 0 4px; font-family:var(--font-display); font-size:15px; }
.explainer p{ margin:0; font-size:13.3px; color:var(--text-dim); line-height:1.55; max-width:760px;}
.explainer ul{ margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--text-dim); line-height:1.7;}
.explainer ul b{ color:var(--text); font-weight:600; }
.explainer-close{
  position:absolute; top:14px; right:14px; background:none; border:none; color:var(--text-mute);
  cursor:pointer; width:26px;height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center;
}
.explainer-close:hover{ background:var(--surface-3); color:var(--text); }

/* =========================================================
   BUTTONS / FORM ELEMENTS
   ========================================================= */
.btn{
  display:inline-flex; align-items:center; gap:6px; justify-content:center;
  padding:9px 14px; border-radius:var(--radius-sm); font-size:13px; font-weight:600;
  cursor:pointer; border:1px solid transparent; transition:all var(--transition); white-space:nowrap;
}
.btn svg{ width:14px; height:14px; }
.btn-primary{ background:var(--teal); color:#04211D; }
.btn-primary:hover{ background:#3EE4CE; transform:translateY(-1px); }
.btn-ghost{ background:var(--surface-2); color:var(--text); border-color:var(--border); }
.btn-ghost:hover{ background:var(--surface-3); }
.btn-outline{ background:transparent; color:var(--text-dim); border-color:var(--border); }
.btn-outline:hover{ color:var(--text); border-color:var(--text-mute); }
.btn-danger{ background:var(--red-bg); color:var(--red); }
.btn-danger:hover{ background:rgba(241,102,122,0.22); }
.btn-sm{ padding:6px 10px; font-size:12px; }
.btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none !important; }

.field{ margin-bottom:14px; }
.field label{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--text); margin-bottom:5px; }
.field .hint{ font-size:11.8px; color:var(--text-mute); font-weight:400; margin-bottom:6px; line-height:1.5; }
select, input[type=text], input[type=number], textarea{
  width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
  border-radius:var(--radius-sm); padding:9px 10px; font-size:13px; font-family:var(--font-body); outline:none;
  transition:border-color var(--transition);
}
textarea{ font-family:var(--font-mono); font-size:12.5px; line-height:1.6; resize:vertical; min-height:80px;}
select:focus, input:focus, textarea:focus{ border-color:var(--teal); }
.chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{
  padding:6px 10px; border-radius:20px; border:1px solid var(--border); background:var(--surface);
  font-size:12px; color:var(--text-dim); cursor:pointer; user-select:none; transition:all var(--transition);
}
.chip.selected{ background:var(--teal-bg); border-color:var(--teal-dim); color:var(--teal); font-weight:600; }
.chip:hover{ border-color:var(--text-mute); }

/* =========================================================
   DASHBOARD
   ========================================================= */
.section-head{ margin-bottom:16px; }
.section-head h2{ font-family:var(--font-display); font-size:20px; margin:0 0 3px; letter-spacing:-0.01em; }
.section-head p{ margin:0; font-size:13px; color:var(--text-mute); }

.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:26px; }
.stat-card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:16px; }
.stat-card .num{ font-family:var(--font-display); font-size:26px; font-weight:700; letter-spacing:-0.02em; }
.stat-card .lbl{ font-size:12px; color:var(--text-mute); margin-top:2px; }

.cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:28px;}
.cat-card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-lg);
  padding:20px; cursor:pointer; transition:all var(--transition); position:relative; overflow:hidden;
}
.cat-card:hover{ border-color:var(--teal-dim); transform:translateY(-2px); box-shadow:var(--shadow-2); }
.cat-card .tag{ display:inline-flex; align-items:center; gap:6px; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--teal); font-weight:700; margin-bottom:10px;}
.cat-card h3{ margin:0 0 6px; font-family:var(--font-display); font-size:17px; }
.cat-card p{ margin:0 0 14px; font-size:12.8px; color:var(--text-dim); line-height:1.55; }
.cat-card .cnt{ font-size:12px; color:var(--text-mute); }
.cat-card.review .tag{ color:var(--violet); }

.quick-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.quick-card{
  background:var(--surface-2); border:1px dashed var(--border); border-radius:var(--radius-lg);
  padding:18px; display:flex; align-items:center; gap:14px; cursor:pointer; transition:all var(--transition);
}
.quick-card:hover{ border-color:var(--teal-dim); background:var(--surface-3); }
.quick-icon{ width:38px;height:38px;border-radius:10px; display:flex;align-items:center;justify-content:center; flex-shrink:0;}
.quick-icon.pb{ background:var(--teal-bg); color:var(--teal);}
.quick-icon.lb{ background:var(--violet-bg); color:var(--violet);}
.quick-card h4{ margin:0 0 2px; font-size:14px; }
.quick-card p{ margin:0; font-size:12px; color:var(--text-mute); }

/* =========================================================
   WORKFLOW LIBRARY
   ========================================================= */
.toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
.tabs{ display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:3px; }
.tab{ padding:7px 13px; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--text-mute); cursor:pointer; border:none; background:none; }
.tab.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-1); }
.fav-toggle{ display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:12.5px; cursor:pointer;}
.fav-toggle.on{ color:var(--amber); border-color:var(--amber); background:var(--amber-bg);}
.fav-toggle svg{width:14px;height:14px;}

.wf-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
.wf-card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md);
  padding:16px; cursor:pointer; transition:all var(--transition); display:flex; flex-direction:column; gap:10px;
}
.wf-card:hover{ border-color:var(--teal-dim); box-shadow:var(--shadow-2); transform:translateY(-1px); }
.wf-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.wf-title{ font-size:14.5px; font-weight:700; letter-spacing:-0.005em; }
.wf-desc{ font-size:12.5px; color:var(--text-dim); line-height:1.5; }
.wf-tags{ display:flex; gap:6px; flex-wrap:wrap; }
.wf-tag{ font-size:10.5px; padding:3px 7px; border-radius:5px; background:var(--surface-2); color:var(--text-mute); border:1px solid var(--border-soft);}
.wf-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:8px; border-top:1px solid var(--border-soft); }
.wf-badge{ font-size:10.5px; color:var(--teal); display:flex; align-items:center; gap:4px; font-weight:600;}
.wf-badge.custom{ color:var(--violet); }
.star-btn{ background:none; border:none; cursor:pointer; color:var(--text-mute); padding:2px; display:flex;}
.star-btn.on{ color:var(--amber); }
.star-btn svg{ width:16px;height:16px; }
.empty-state{ text-align:center; padding:60px 20px; color:var(--text-mute); }
.empty-state svg{ width:34px;height:34px; margin-bottom:10px; opacity:0.6;}
.empty-state h4{ color:var(--text); font-size:14.5px; margin:0 0 5px;}
.empty-state p{ font-size:12.8px; max-width:340px; margin:0 auto; line-height:1.5;}

/* =========================================================
   MODAL / DETAIL PANEL
   ========================================================= */
.overlay{ position:fixed; inset:0; background:rgba(3,7,13,0.6); backdrop-filter:blur(2px); z-index:100; display:flex; justify-content:flex-end; opacity:0; pointer-events:none; transition:opacity var(--transition); }
.overlay.show{ opacity:1; pointer-events:auto; }
.panel{
  width:min(620px,100%); height:100%; background:var(--bg-soft); border-left:1px solid var(--border);
  overflow-y:auto; transform:translateX(24px); transition:transform var(--transition); box-shadow:var(--shadow-3);
}
.overlay.show .panel{ transform:translateX(0); }
.panel-head{ position:sticky; top:0; background:var(--bg-soft); border-bottom:1px solid var(--border-soft); padding:18px 22px; display:flex; align-items:flex-start; gap:12px; z-index:5;}
.panel-head .htxt{ flex:1; }
.panel-head h2{ margin:0 0 4px; font-family:var(--font-display); font-size:18px; }
.panel-head p{ margin:0; font-size:12.5px; color:var(--text-mute); line-height:1.5;}
.panel-close{ background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text-dim); width:28px; height:28px; border-radius:7px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.panel-body{ padding:20px 22px 60px; }
.panel-actions{ display:flex; gap:8px; padding:14px 22px; border-top:1px solid var(--border-soft); position:sticky; bottom:0; background:var(--bg-soft); flex-wrap:wrap;}

.subhead{ font-size:11px; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-mute); font-weight:700; margin:20px 0 10px; display:flex; align-items:center; gap:6px;}
.subhead:first-child{ margin-top:0; }

.term-box{
  background:#080F18; border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden;
}
html.light .term-box{ background:#0E1826; }
.term-bar{ display:flex; align-items:center; gap:6px; padding:9px 12px; background:rgba(255,255,255,0.03); border-bottom:1px solid var(--border);}
.term-dot{ width:9px;height:9px;border-radius:50%; }
.term-title{ margin-left:6px; font-size:11px; color:var(--text-mute); font-family:var(--font-mono);}
.term-body{ padding:14px 16px; font-family:var(--font-mono); font-size:12.3px; line-height:1.7; color:#D6E4F0; white-space:pre-wrap; word-break:break-word; max-height:360px; overflow-y:auto;}
.term-body b{ color:var(--teal); font-weight:600;}
.copy-fab{ display:flex; align-items:center; gap:6px; padding:6px 11px; font-size:11.5px; background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text-dim); border-radius:6px; cursor:pointer;}
.copy-fab:hover{ color:var(--text); background:var(--surface-3);}
.copy-fab svg{ width:12px;height:12px;}

.bp-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.bp-list li{ display:flex; gap:8px; font-size:12.8px; color:var(--text-dim); line-height:1.55;}
.bp-list li svg{ width:14px;height:14px; color:var(--teal); flex-shrink:0; margin-top:2px;}

/* =========================================================
   BUILDERS (Prompt Builder / Loop Builder)
   ========================================================= */
.builder-layout{ display:grid; grid-template-columns:300px 1fr; gap:18px; align-items:start; }
.block-picker{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:14px; position:sticky; top:84px; }
.block-picker h4{ margin:0 0 3px; font-size:13px; }
.block-picker .sub{ font-size:11.5px; color:var(--text-mute); margin-bottom:12px; line-height:1.5;}
.pick-item{
  display:flex; gap:10px; padding:10px; border-radius:var(--radius-sm); border:1px solid var(--border-soft);
  margin-bottom:8px; cursor:pointer; transition:all var(--transition); background:var(--surface-2);
}
.pick-item:hover{ border-color:var(--teal-dim); }
.pick-item.added{ opacity:0.45; cursor:default; }
.pick-icon{ width:26px;height:26px;border-radius:7px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--teal);}
.pick-icon svg{ width:14px;height:14px;}
.pick-txt strong{ display:block; font-size:12.5px; margin-bottom:2px;}
.pick-txt span{ display:block; font-size:11px; color:var(--text-mute); line-height:1.45;}

.assembled{ display:flex; flex-direction:column; gap:12px; margin-bottom:18px;}
.blk-card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:14px 16px; }
.blk-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:4px;}
.blk-head .lft{ display:flex; align-items:center; gap:8px;}
.blk-num{ width:20px;height:20px;border-radius:5px; background:var(--teal-bg); color:var(--teal); font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center;}
.blk-head strong{ font-size:13.5px; }
.blk-remove{ background:none; border:none; color:var(--text-mute); cursor:pointer; padding:3px;}
.blk-remove:hover{ color:var(--red); }
.blk-help{ font-size:11.8px; color:var(--text-mute); line-height:1.5; margin:0 0 10px; }

.builder-empty{ padding:40px 20px; text-align:center; border:1px dashed var(--border); border-radius:var(--radius-lg); color:var(--text-mute); font-size:13px;}

.preview-wrap{ position:sticky; bottom:0; }

/* =========================================================
   MISC
   ========================================================= */
.badge-dot{ width:7px;height:7px;border-radius:50%; display:inline-block; }
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); z-index:300;
  background:var(--surface-3); border:1px solid var(--border); color:var(--text); padding:11px 18px;

const TEMPLATES = [
{
  id:"t-unit-gen", category:"testing", title:"Unit Test Generator",

  bestPractices:[
    "Always paste the real function signature, not a paraphrase — Claude tests what's actually there.",

{

{{existing}}

/* =========================================================
   STATE
   ========================================================= */
const LS_KEYS = { custom:"pab_customWorkflows", fav:"pab_favorites", dismissed:"pab_explainerDismissed", theme:"pab_theme", onboarded:"pab_onboarded" };

let state = {
  route: "dashboard",
  search: "",
  workflowTab: "testing",
  favOnly: false,
  custom: loadJSON(LS_KEYS.custom, []),
  favorites: loadJSON(LS_KEYS.fav, []),
  pbBlocks: [],      // added block keys, in order, for prompt builder
  pbValues: {},       // key -> value
  lbBlocks: [],
  lbValues: {},
  sidebarOpen: false
};

function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(pref){ return pref+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function allWorkflows(){ return TEMPLATES.concat(state.custom); }
function findWorkflow(id){ return allWorkflows().find(w=>w.id===id); }
function isFav(id){ return state.favorites.includes(id); }
function toggleFav(id){
  if(isFav(id)) state.favorites = state.favorites.filter(x=>x!==id);
  else state.favorites.push(id);
  saveJSON(LS_KEYS.fav, state.favorites);
}

/* =========================================================
   NAV
   ========================================================= */
const NAV_ITEMS = [
  {id:"dashboard", label:"Dashboard", icon:ICONS.dashboard, group:"main"},
  {id:"wf-testing", label:"Testing & QA", icon:ICONS.testing, group:"workflows", cat:"testing"},
  {id:"wf-review", label:"Code Review", icon:ICONS.review, group:"workflows", cat:"review"},
  {id:"wf-mine", label:"My Workflows", icon:ICONS.mine, group:"workflows", cat:"mine"},
  {id:"prompt-builder", label:"Prompt Builder", icon:ICONS.builder, group:"tools"},
  {id:"loop-builder", label:"Loop Builder", icon:ICONS.loop, group:"tools"}
];

function renderNav(){
  const groups = [
    {key:"main", label:null},
    {key:"workflows", label:"Workflows"},
    {key:"tools", label:"Builders"}
  ];
  let html = "";
  groups.forEach(g=>{
    if(g.label) html += `<div class="nav-label">${g.label}</div>`;
    NAV_ITEMS.filter(i=>i.group===g.key).forEach(item=>{
      let count = "";
      if(item.cat === "testing") count = TEMPLATES.filter(t=>t.category==='testing').length + state.custom.filter(t=>t.category==='testing').length;
      if(item.cat === "review") count = TEMPLATES.filter(t=>t.category==='review').length + state.custom.filter(t=>t.category==='review').length;
      if(item.cat === "mine") count = state.custom.length;
      const active = state.route === item.id;
      html += `<button class="nav-item ${active?'active':''}" data-route="${item.id}">${item.icon}<span>${item.label}</span>${count!==""?`<span class="nav-count">${count}</span>`:""}</button>`;
    });
  });
  document.getElementById("navList").innerHTML = html;
  document.querySelectorAll(".nav-item").forEach(b=>b.addEventListener("click", ()=>{ navigate(b.dataset.route); state.sidebarOpen=false; document.getElementById("sidebar").classList.remove("open"); }));
}

function navigate(route){
  state.route = route;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* =========================================================
   RENDER ROOT
   ========================================================= */
function render(){
  renderNav();
  const titleMap = {
    "dashboard":["Dashboard","Your saved AI prompt workflows, at a glance"],
    "wf-testing":["Testing & QA","Reusable prompt workflows for tests, coverage, and QA planning"],
    "wf-review":["Code Review & Refactoring","Reusable prompt workflows for reviews, refactors, and audits"],
    "wf-mine":["My Workflows","Workflows you've created, edited, or favorited"],
    "prompt-builder":["Prompt Builder","Assemble a structured prompt from reusable building blocks"],
    "loop-builder":["Loop Builder","Turn any prompt into a self-checking, self-improving loop"]
  };
  const [t,s] = titleMap[state.route] || titleMap.dashboard;
  document.getElementById("pageTitle").textContent = t;
  document.getElementById("pageSub").textContent = s;

  const c = document.getElementById("content");
  if(state.route === "dashboard") c.innerHTML = renderDashboard();
  else if(state.route === "wf-testing"){ state.workflowTab="testing"; c.innerHTML = renderWorkflowLibrary(); }
  else if(state.route === "wf-review"){ state.workflowTab="review"; c.innerHTML = renderWorkflowLibrary(); }
  else if(state.route === "wf-mine"){ state.workflowTab="mine"; c.innerHTML = renderWorkflowLibrary(); }
  else if(state.route === "prompt-builder") c.innerHTML = renderPromptBuilder();
  else if(state.route === "loop-builder") c.innerHTML = renderLoopBuilder();

  attachContentHandlers();
}

/* =========================================================
   WORKFLOW LIBRARY
   ========================================================= */
function renderWorkflowLibrary(){
  const tab = state.workflowTab;
  let list;
  if(tab === "mine") list = state.custom.slice();
  else list = TEMPLATES.filter(t=>t.category===tab).concat(state.custom.filter(t=>t.category===tab));

  if(state.favOnly) list = list.filter(w=>isFav(w.id));
  if(state.search.trim()){
    const q = state.search.toLowerCase();
    list = list.filter(w => w.title.toLowerCase().includes(q) || w.purpose.toLowerCase().includes(q) || (w.tags||[]).some(t=>t.toLowerCase().includes(q)));
  }

  const subtitle = tab==="testing" ? "Turn recurring testing &amp; QA work into repeatable prompts." :
                    tab==="review" ? "Turn recurring code review work into repeatable prompts." :
                    "Everything you've personally created, edited, or starred, saved in this browser.";

  return `
  <p style="font-size:13px;color:var(--text-mute);margin:-6px 0 18px;">${subtitle}</p>
  <div class="toolbar">
    <div class="tabs">
      <button class="tab ${tab==='testing'?'active':''}" data-tab="testing">Testing & QA</button>
      <button class="tab ${tab==='review'?'active':''}" data-tab="review">Code Review</button>
      <button class="tab ${tab==='mine'?'active':''}" data-tab="mine">My Workflows</button>
    </div>
    <button class="fav-toggle ${state.favOnly?'on':''}" id="favOnlyBtn">${state.favOnly?ICONS.star:ICONS.starOutline} Favorites only</button>
    <div style="flex:1"></div>
    <button class="btn btn-primary" id="newWorkflowBtn">${ICONS.plus} New workflow</button>
  </div>
  <div class="wf-grid">
    ${list.length ? list.map(w=>workflowCard(w)).join("") : `
      <div class="empty-state" style="grid-column:1/-1;">
        ${ICONS.testing}
        <h4>${state.search? "No workflows match your search" : (tab==="mine" ? "No custom workflows yet" : "Nothing here yet")}</h4>
        <p>${state.search ? "Try a different search term, or clear it to see everything in this category." : (tab==="mine" ? "Save a workflow from the library, or build one from scratch in the Prompt Builder." : "Try another category or clear your filters.")}</p>
      </div>`}
  </div>`;
}

function workflowCard(w){
  const isCustom = !!w.custom;
  return `

    <div class="wf-desc">${esc(w.purpose)}</div>

}

/* =========================================================

let detailState = { id:null, values:{} };

function openDetail(id){
  const w = findWorkflow(id);
  if(!w) return;
  detailState = { id, values:{} };
  (w.variables||[]).forEach(v=> detailState.values[v.key] = v.default || "");
  renderDetailPanel();
  document.getElementById("detailOverlay").classList.add("show");
}
function closeDetail(){ document.getElementById("detailOverlay").classList.remove("show"); }

function fillTemplate(w){
  let out = w.template;
  (w.variables||[]).forEach(v=>{
    const val = detailState.values[v.key] || "";
    out = out.split("{{"+v.key+"}}").join(val);
  });
  return out;
}

function fieldHTML(v, value){
  const help = `<div class="hint">${esc(v.help||"")}</div>`;
  if(v.type === "select"){
    return `<div class="field"><label>${esc(v.label)}</label>${help}<select data-field="${v.key}">${v.options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join("")}</select></div>`;
  }
  if(v.type === "textarea"){
    return `<div class="field"><label>${esc(v.label)}</label>${help}<textarea data-field="${v.key}" rows="4">${esc(value)}</textarea></div>`;
  }
  return `<div class="field"><label>${esc(v.label)}</label>${help}<input type="text" data-field="${v.key}" value="${esc(value)}"></div>`;
}

function copyText(text){
  const done = ()=> showToast("Prompt copied to clipboard");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, cb){
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta); cb();
}

}

function openWorkflowEditor(existing){

    id: uid("wf"), category:"testing", title:"", purpose:"", tags:[], template:"", bestPractices:[], variables:[], custom:true
  };
  document.getElementById("modalBox").innerHTML = `

      <div class="field"><label>Category</label>

        </select>

    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" id="ewCancel">Cancel</button>
      <button class="btn btn-primary" id="ewSave">${ICONS.check} Save workflow</button>
    </div>
  `;
  showModal();
  document.getElementById("modalCloseX").onclick = hideModal;
  document.getElementById("ewCancel").onclick = hideModal;
  document.getElementById("ewSave").onclick = ()=>{
    const title = document.getElementById("ewTitle").value.trim();
    const template = document.getElementById("ewTemplate").value.trim();
    if(!title || !template){ showToast("Title and template are required"); return; }
    w.title = title;
    w.category = document.getElementById("ewCategory").value;
    w.purpose = document.getElementById("ewPurpose").value.trim() || "A custom workflow.";
    w.template = template;
    w.tags = document.getElementById("ewTags").value.split(",").map(s=>s.trim()).filter(Boolean);
    // auto-detect variables from {{...}} not already defined
    const found = Array.from(new Set((template.match(/{{\s*[\w]+\s*}}/g)||[]).map(m=>m.replace(/[{}]/g,'').trim())));
    const existingKeys = (w.variables||[]).map(v=>v.key);
    found.forEach(k=>{
      if(!existingKeys.includes(k)) w.variables = (w.variables||[]).concat([{key:k, label:k.replace(/_/g,' '), type:"textarea", default:"", help:"Fill in a value for "+k+"."}]);
    });
    w.variables = (w.variables||[]).filter(v=>found.includes(v.key));
    w.custom = true;
    if(isEdit){
      const idx = state.custom.findIndex(x=>x.id===w.id);
      if(idx>-1) state.custom[idx] = w;
    } else {
      state.custom.push(w);
    }
    saveJSON(LS_KEYS.custom, state.custom);
    hideModal();
    showToast(isEdit? "Workflow updated" : "Workflow saved to My Workflows");
    render();
    if(isEdit) openDetail(w.id);
  };
}

/* =========================================================
   LOOP BUILDER
   ========================================================= */
function lbAssemble(){
  const order = LB_BLOCKS.filter(b=>state.lbBlocks.includes(b.key));
  const parts = order.map(b=>`<${b.key}>${state.lbValues[b.key]||""}</${b.key}>`).join("\n\n");
  if(!order.length) return "";
  return parts + `\n\nLOOP INSTRUCTIONS:\nRepeat the following cycle: (1) attempt the base task, (2) evaluate the result strictly against the evaluation criteria, (3) if the goal is not yet met and no stop condition has been triggered, revise using the improvement strategy above and try again. Never violate the safety rules above, even if it would help reach the goal faster. Stop and report back as soon as any stop condition is met.`;
}

    <li><b>Dashboard</b> — an overview of your workflow library and quick links to everything else.</li>
    <li><b>Testing &amp; QA / Code Review</b> — ready-made workflows for your specific use cases. Fill in a few fields, copy the result into Claude.</li>
    <li><b>Prompt Builder</b> — assemble a one-off prompt from building blocks (role, objective, constraints, tone, etc.), with a live preview.</li>
    <li><b>Loop Builder</b> — turn any prompt into an autonomous loop: Claude attempts the task, checks its own result against goals you set, and retries until it succeeds or hits a stop condition.</li>
    <li><b>My Workflows</b> — anything you save, duplicate, or favorite. Stored only in this browser — use Export to back it up.</li>
  </ul>`;
}

/* =========================================================
   TOAST
   ========================================================= */
let toastTimer;
function showToast(msg){
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 2200);
}

/* =========================================================
   THEME
   ========================================================= */
function applyTheme(){
  const theme = loadJSON(LS_KEYS.theme, "dark");
  document.documentElement.classList.toggle("light", theme==="light");
  document.getElementById("themeLabel").textContent = theme==="light" ? "Light" : "Dark";
  document.getElementById("themeIcon").innerHTML = theme==="light"
    ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
    : '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
}
function toggleTheme(){
  const cur = loadJSON(LS_KEYS.theme, "dark");
  saveJSON(LS_KEYS.theme, cur==="light" ? "dark" : "light");
  applyTheme();
}

/* =========================================================
   IMPORT / EXPORT
   ========================================================= */
function exportData(){
  const data = { exportedAt: new Date().toISOString(), customWorkflows: state.custom, favorites: state.favorites };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "personal-ai-playbook-backup.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Backup file downloaded");
}
function importData(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(Array.isArray(data.customWorkflows)){
        const existingIds = new Set(state.custom.map(w=>w.id));
        data.customWorkflows.forEach(w=>{ if(!existingIds.has(w.id)){ w.custom = true; state.custom.push(w); } });
        saveJSON(LS_KEYS.custom, state.custom);
      }
      if(Array.isArray(data.favorites)){
        state.favorites = Array.from(new Set(state.favorites.concat(data.favorites)));
        saveJSON(LS_KEYS.fav, state.favorites);
      }
      showToast("Backup imported successfully");
      render();
    }catch(err){ showToast("Couldn't read that file — is it a valid backup?"); }
  };
  reader.readAsText(file);
}

/* =========================================================
   GLOBAL EVENTS
   ========================================================= */
document.getElementById("themeToggle").addEventListener("click", toggleTheme);
document.getElementById("helpBtn").addEventListener("click", openHelp);
document.getElementById("exportBtn").addEventListener("click", exportData);
document.getElementById("importBtn").addEventListener("click", ()=> document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", (e)=>{ if(e.target.files[0]) importData(e.target.files[0]); e.target.value=""; });
document.getElementById("menuToggle").addEventListener("click", ()=> document.getElementById("sidebar").classList.toggle("open"));
document.getElementById("detailOverlay").addEventListener("click", (e)=>{ if(e.target.id==="detailOverlay") closeDetail(); });
document.getElementById("modalBg").addEventListener("click", (e)=>{ if(e.target.id==="modalBg") hideModal(); });

const searchInput = document.getElementById("globalSearch");
searchInput.addEventListener("input", ()=>{
  state.search = searchInput.value;
  if(!state.route.startsWith("wf-")) navigate("wf-testing");
  else render();
  searchInput.focus();
});

document.addEventListener("keydown", (e)=>{
  const tag = (e.target.tagName||"").toLowerCase();
  const typing = tag==="input" || tag==="textarea" || tag==="select";
  if(e.key === "Escape"){ closeDetail(); hideModal(); return; }
  if(typing) return;
  if(e.key === "/" && !e.shiftKey){ e.preventDefault(); searchInput.focus(); }
  else if(e.key === "?" || (e.key==="/" && e.shiftKey)){ e.preventDefault(); openHelp(); }
  else if(e.key.toLowerCase() === "d"){ toggleTheme(); }
  else if(e.key.toLowerCase() === "n"){ openWorkflowEditor(null); }
});

/* =========================================================
   INIT
   ========================================================= */
applyTheme();
render();
if(!loadJSON(LS_KEYS.onboarded, false)){ setTimeout(openOnboarding, 400); }

})();
</script>
